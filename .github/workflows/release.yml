name: Build and publish release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload artifacts and update stable.json"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: cliplm-release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.12.19"

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v9
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Read and validate release version
        id: version
        env:
          RELEASE_REF: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)"
          test -n "$version"
          if [[ "$EVENT_NAME" == "push" && "$RELEASE_REF" != "v$version" ]]; then
            echo "Tag $RELEASE_REF does not match pyproject version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Run release-critical tests
        run: uv run pytest -q

  build-linux:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Linux packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes curl dpkg-dev patchelf ccache

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v9
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Build DEB and AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: ./packaging/linux/build_release.sh

      - name: Stage Linux artifacts
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          mkdir -p staging/linux/x86_64
          cp "dist/cliplm_${VERSION}_amd64.deb" staging/linux/x86_64/
          cp "dist/cliplm-${VERSION}-amd64.AppImage" staging/linux/x86_64/
          sha256sum staging/linux/x86_64/* > staging/linux-sha256sums.txt

      - name: Upload Linux build
        uses: actions/upload-artifact@v7
        with:
          name: release-linux-x86_64
          path: staging/
          if-no-files-found: error
          retention-days: 14